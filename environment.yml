# Packages of gsmap-explorer. install.bat creates the env in env\ from this file:
#   conda env create -p env -f environment.yml
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - pandas
  - matplotlib
  - netcdf4
  - cartopy
  - geopandas
  - shapely
  - pyproj
  - rasterio=1.5.0      # 1.5.2 + libgdal-core 3.13.3 fails to import (DLL _warp), 2026-10-17
  - libgdal-core=3.12
